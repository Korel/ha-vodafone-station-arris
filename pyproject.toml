[project]
name = "ha-vodafone-station-arris"
version = "0.4.0"
description = "Home Assistant custom integration for ARRIS-based Vodafone Stations (TG6442)"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "aiohttp", "cryptography"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.uv]
package = false
